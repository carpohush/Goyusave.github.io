<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOYU · 清新集</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js">
    </script>
    <style>
        /* ===== 字体 ===== */
        @font-face {
            font-family: 'HuiwenMingchao';
            src: url('fonts/huiwenmingchao.woff2') format('woff2'),
                url('fonts/huiwenmingchao.woff') format('woff'),
                url('fonts/huiwenmingchao.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: '楷体', 'KaiTi', serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #F0FFFF, #F8C8DC);
            background-attachment: fixed;
            color: #2c3e50;
            padding-top: 70px;
            position: relative;
            overflow-x: hidden;
        }
        body.lightbox-open {
            overflow: hidden;
        }
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 32px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }
        .navbar-brand {
            font-family: '仿宋', 'FangSong', serif;
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #87CEEB, #FFC0CB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(135, 206, 235, 0.3);
        }
        .nav-links {
            display: flex;
            gap: 16px;
        }
        .nav-btn {
            padding: 10px 28px;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            font-family: '楷体', 'KaiTi', serif;
            font-size: 1.2rem;
            color: #2c3e50;
            cursor: pointer;
            transition: transform 0.25s ease, background 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .nav-btn:hover {
            transform: scale(1.10);
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 6px 24px rgba(135, 206, 235, 0.25);
        }
        .nav-btn.active {
            background: rgba(135, 206, 235, 0.35);
            border-color: #87CEEB;
            box-shadow: 0 0 0 2px rgba(135, 206, 235, 0.2);
        }

        /* ===== 主视觉 ===== */
        .hero {
            text-align: center;
            padding: 40px 20px 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 48px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(135, 206, 235, 0.10);
        }
        .hero h1 {
            font-family: 'Great Vibes', 'Brush Script MT', cursive;
            font-size: 2.4rem;
            font-weight: normal;
            background: linear-gradient(135deg, #87CEEB, #FFC0CB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        .hero p {
            font-family: 'HuiwenMingchao', '楷体', 'KaiTi', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: #3d5a73;
            opacity: 0.85;
            letter-spacing: 2px;
        }

        /* ===== 视图 ===== */
        .view {
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .view.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* ===== 卡片 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 32px;
            margin: 30px 0 40px;
        }
        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 20px 20px 24px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.25s ease, box-shadow 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(135, 206, 235, 0.18);
        }
        .card.editing {
            border-color: #87CEEB;
            box-shadow: 0 0 0 3px rgba(135, 206, 235, 0.3), 0 8px 32px rgba(135, 206, 235, 0.15);
            transform: translateY(-4px);
            cursor: default;
        }
        .card-cover {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: rgba(200, 220, 235, 0.3);
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        .card-cover[src=""] {
            opacity: 0.4;
        }
        .card-view {
            width: 100%;
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e3b4a;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .card-desc {
            font-size: 1rem;
            color: #3d5a73;
            opacity: 0.8;
            line-height: 1.6;
            word-break: break-word;
        }
        .card-edit {
            width: 100%;
            display: none;
        }
        .card.editing .card-view {
            display: none;
        }
        .card.editing .card-edit {
            display: block;
        }
        .card-title-input,
        .card-desc-input {
            width: 100%;
            padding: 8px 14px;
            border: 2px solid rgba(135, 206, 235, 0.4);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            font-family: '楷体', 'KaiTi', serif;
            font-size: 1rem;
            color: #1e3b4a;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
            margin-bottom: 10px;
        }
        .card-title-input:focus,
        .card-desc-input:focus {
            border-color: #87CEEB;
            background: rgba(255, 255, 255, 0.8);
        }
        .card-title-input {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .card-desc-input {
            font-size: 0.95rem;
            min-height: 60px;
            resize: vertical;
        }
        .card-edit-cover {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            border: 1px dashed rgba(135, 206, 235, 0.3);
            flex-wrap: wrap;
            justify-content: center;
        }
        .card-edit-cover-preview {
            width: 72px;
            height: 54px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            background: rgba(200, 220, 235, 0.3);
        }
        .card-edit-cover-btn {
            padding: 6px 18px;
            border: none;
            border-radius: 30px;
            font-family: '楷体', 'KaiTi', serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            background: rgba(135, 206, 235, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #1e3b4a;
            display: inline-block;
        }
        .card-edit-cover-btn:hover {
            transform: scale(1.05);
            background: rgba(135, 206, 235, 0.5);
        }
        .card-edit-cover-btn input[type="file"] {
            display: none;
        }
        .card-edit-cover-hint {
            font-size: 0.8rem;
            color: #5a7a8a;
            opacity: 0.7;
        }
        .card-edit-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 6px;
        }
        .card-edit-btn-sm {
            padding: 4px 18px;
            border: none;
            border-radius: 30px;
            font-family: '楷体', 'KaiTi', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(4px);
            color: #1e3b4a;
        }
        .card-edit-btn-sm:hover {
            transform: scale(1.06);
            background: rgba(255, 255, 255, 0.55);
        }
        .card-edit-btn-sm.save-sm {
            background: rgba(135, 206, 235, 0.35);
            border-color: #87CEEB;
        }
        .card-edit-btn-sm.save-sm:hover {
            background: rgba(135, 206, 235, 0.55);
        }
        .card-edit-btn-sm.cancel-sm {
            background: rgba(200, 200, 200, 0.2);
            border-color: #bbb;
        }
        .card-edit-btn-sm.cancel-sm:hover {
            background: rgba(200, 200, 200, 0.4);
        }
        .card-edit-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #1e3b4a;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.25s, background 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            z-index: 5;
            opacity: 0.7;
        }
        .card-edit-toggle:hover {
            transform: scale(1.15);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 4px 16px rgba(135, 206, 235, 0.2);
            opacity: 1;
        }
        .card.editing .card-edit-toggle {
            display: none;
        }
        .empty-hint {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: #5a7a8a;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 48px;
            backdrop-filter: blur(4px);
            border: 1px dashed rgba(135, 206, 235, 0.3);
        }

        /* ===== 详情视图 ===== */
        .detail-back-wrap {
            margin-bottom: 12px;
            text-align: left;
        }
        .detail-back-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: '楷体', 'KaiTi', serif;
            font-size: 1.1rem;
            color: #1e3b4a;
            cursor: pointer;
            transition: transform 0.25s, background 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            white-space: nowrap;
        }
        .detail-back-btn:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 6px 20px rgba(135, 206, 235, 0.2);
        }
        .detail-title {
            font-size: 2.0rem;
            font-weight: bold;
            color: #1e3b4a;
            text-shadow: 0 4px 16px rgba(135, 206, 235, 0.35), 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            word-break: break-word;
            transition: all 0.2s;
        }
        .detail-title-input {
            font-size: 2.0rem;
            font-weight: bold;
            color: #1e3b4a;
            width: 100%;
            padding: 8px 12px;
            border: 2px solid rgba(135, 206, 235, 0.4);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            font-family: '楷体', 'KaiTi', serif;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }
        .detail-title-input:focus {
            border-color: #87CEEB;
            background: rgba(255, 255, 255, 0.7);
        }
        .detail-body {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            min-height: 200px;
            position: relative;
        }
        .detail-text {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: '楷体', 'KaiTi', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #1e3b4a;
            margin-bottom: 20px;
        }
        .detail-textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            border: 2px solid rgba(135, 206, 235, 0.4);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            font-family: '楷体', 'KaiTi', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #1e3b4a;
            outline: none;
            resize: vertical;
            transition: border-color 0.3s;
        }
        .detail-textarea:focus {
            border-color: #87CEEB;
            background: rgba(255, 255, 255, 0.7);
        }

        .detail-image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .detail-image-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .detail-image-grid img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 28px rgba(135, 206, 235, 0.2);
        }
        .detail-image-single {
            max-width: 100%;
            max-height: 480px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: 8px 0;
            display: block;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .detail-image-single:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 40px rgba(135, 206, 235, 0.15);
        }
        .detail-empty {
            color: #5a7a8a;
            text-align: center;
            padding: 40px 20px;
            font-size: 1.2rem;
        }

        /* ★★★ 图片管理器 ★★★ */
        .image-manager {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid rgba(135, 206, 235, 0.2);
        }
        .image-manager-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e3b4a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .image-manager-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            min-height: 60px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            border: 1px dashed rgba(135, 206, 235, 0.2);
        }
        .image-manager-item {
            position: relative;
            width: 100px;
            height: 75px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            background: rgba(200, 220, 235, 0.3);
            transition: transform 0.2s, border-color 0.2s;
            cursor: grab;
        }
        .image-manager-item:hover {
            border-color: #87CEEB;
            transform: scale(1.02);
        }
        .image-manager-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-manager-item .img-index {
            position: absolute;
            top: 4px;
            left: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.7rem;
            padding: 0 8px;
            border-radius: 12px;
            font-family: '楷体', serif;
            backdrop-filter: blur(4px);
        }
        .image-manager-item .img-del {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(200, 50, 50, 0.8);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: '楷体', serif;
        }
        .image-manager-item .img-del:hover {
            transform: scale(1.15);
            background: rgba(220, 30, 30, 0.95);
        }
        .image-manager-item .img-move-up,
        .image-manager-item .img-move-down {
            position: absolute;
            bottom: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 0.7rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: '楷体', serif;
            backdrop-filter: blur(4px);
        }
        .image-manager-item .img-move-up:hover,
        .image-manager-item .img-move-down:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }
        .image-manager-item .img-move-up {
            left: 4px;
        }
        .image-manager-item .img-move-down {
            right: 4px;
        }
        .image-manager-upload {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-family: '楷体', 'KaiTi', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            background: rgba(135, 206, 235, 0.3);
            border: 1px solid rgba(135, 206, 235, 0.3);
            color: #1e3b4a;
        }
        .image-manager-upload:hover {
            transform: scale(1.05);
            background: rgba(135, 206, 235, 0.5);
        }
        .image-manager-upload input[type="file"] {
            display: none;
        }

        .detail-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
        }
        .detail-action-btn {
            padding: 8px 28px;
            border: none;
            border-radius: 40px;
            font-family: '楷体', 'KaiTi', serif;
            font-size: 1.0rem;
            cursor: pointer;
            transition: transform 0.25s, background 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(4px);
            color: #1e3b4a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .detail-action-btn:hover {
            transform: scale(1.06);
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 6px 20px rgba(135, 206, 235, 0.2);
        }
        .detail-action-btn.edit-btn {
            background: rgba(135, 206, 235, 0.3);
            border-color: #87CEEB;
        }
        .detail-action-btn.edit-btn:hover {
            background: rgba(135, 206, 235, 0.5);
        }
        .detail-action-btn.save-btn {
            background: rgba(255, 160, 180, 0.35);
            border-color: #FFC0CB;
        }
        .detail-action-btn.save-btn:hover {
            background: rgba(255, 160, 180, 0.55);
        }
        .detail-action-btn.cancel-edit-btn {
            background: rgba(200, 200, 200, 0.25);
            border-color: #aaa;
        }
        .detail-action-btn.cancel-edit-btn:hover {
            background: rgba(200, 200, 200, 0.45);
        }
        .detail-action-btn.preview-btn {
            background: rgba(200, 230, 200, 0.3);
            border-color: rgba(100, 200, 100, 0.4);
        }
        .detail-action-btn.preview-btn:hover {
            background: rgba(200, 230, 200, 0.5);
        }

        /* ===== 预览模态框 ===== */
        .preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 250;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
